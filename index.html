<title>202611 捷克旅遊｜德勒斯登・布拉格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A22;
    --ink-soft:#4A5A50;
    --parchment:#F2ECDD;
    --parchment-dim:#E7DFC9;
    --brass:#A9812E;
    --brass-soft:#D8C089;
    --sage:#5F7A5E;
    --brick:#8B4B3B;
    --line:rgba(27,42,34,0.14);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--parchment);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:780px;margin:0 auto;padding:0 20px 56px;}

  /* header */
  header{background:var(--ink);color:var(--parchment);padding:38px 20px 24px;}
  header .inner{max-width:780px;margin:0 auto;}
  header .kicker{font-size:13px;color:var(--brass-soft);font-weight:500;margin-bottom:6px;}
  header h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(26px,5vw,38px);margin:0 0 6px;line-height:1.2;}
  header p.sub{margin:0 0 18px;color:var(--brass-soft);font-size:14.5px;}
  .meta-row{display:flex;gap:8px 22px;flex-wrap:wrap;font-size:13px;color:rgba(242,236,221,0.78);border-top:1px solid rgba(242,236,221,0.18);padding-top:14px;}
  .meta-row b{color:var(--parchment);font-weight:600;}
  .progress{margin-top:12px;height:4px;background:rgba(242,236,221,0.18);border-radius:2px;overflow:hidden;}
  .progress i{display:block;height:100%;width:0;background:var(--brass-soft);transition:width .3s;}

  /* tabs */
  nav.tabs{position:sticky;top:0;z-index:10;background:var(--parchment);border-bottom:1px solid var(--line);padding:12px 20px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs .inner{max-width:780px;margin:0 auto;display:inline-flex;gap:8px;}
  .tab{font-family:inherit;font-size:13.5px;font-weight:500;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;flex:none;line-height:1.3;text-align:center;}
  .tab small{display:block;font-size:10.5px;font-weight:400;opacity:.75;}
  .tab.active{background:var(--ink);border-color:var(--ink);color:var(--parchment);}

  section.panel{display:none;padding-top:28px;}
  section.panel.active{display:block;}

  /* day head */
  .day-head .label{font-size:13px;color:var(--brass);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .city-tag{font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:10px;border:1px solid currentColor;}
  .city-dresden{color:var(--brick);}
  .city-prague{color:var(--sage);}
  .day-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(21px,4vw,28px);margin:4px 0 8px;line-height:1.3;}
  .day-head .pace{color:var(--ink-soft);font-size:13.5px;line-height:1.7;margin:0 0 12px;max-width:58ch;}
  .night{font-size:13px;color:var(--ink-soft);margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .night b{color:var(--ink);}
  .night .pending{color:var(--brick);}
  .alert{background:var(--parchment-dim);border-left:3px solid var(--brick);padding:10px 14px;font-size:13px;color:var(--ink-soft);line-height:1.65;border-radius:0 6px 6px 0;margin-bottom:8px;}
  .alert b{color:var(--brick);}
  .route-btn{display:inline-flex;align-items:center;gap:6px;margin:6px 0 18px;font-size:12.5px;font-weight:500;color:var(--parchment);background:var(--sage);text-decoration:none;padding:7px 13px;border-radius:16px;}
  .route-btn svg{width:14px;height:14px;flex:none;}

  /* stops */
  .stop{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);}
  .stop:last-of-type{border-bottom:1px solid var(--line);}
  .rail{width:84px;flex:none;padding-top:2px;}
  .time-chip{font-size:12px;color:var(--ink);font-weight:600;display:block;margin-bottom:6px;line-height:1.35;}
  .cat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);}
  .ico{width:14px;height:14px;display:inline-block;background-size:contain;background-repeat:no-repeat;background-position:center;flex:none;}

  .stop-body{flex:1;min-width:0;}
  .stop-body h3{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin:0 0 5px;line-height:1.35;transition:opacity .2s;}
  .stop-body p{margin:0 0 10px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);max-width:56ch;}
  .links{display:flex;flex-wrap:wrap;gap:8px;}
  .map-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--sage);text-decoration:none;border:1px solid var(--line);padding:4px 10px;border-radius:14px;}
  .map-link:hover{border-color:var(--sage);}
  .map-link svg{width:11px;height:11px;flex:none;}
  .check{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-soft);background:transparent;cursor:pointer;position:relative;margin-top:2px;padding:0;}
  .check.on{background:var(--sage);border-color:var(--sage);}
  .check.on::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:9px;border-right:2px solid var(--parchment);border-bottom:2px solid var(--parchment);transform:rotate(40deg);}
  .stop.done h3,.stop.done p{opacity:.42;}
  .stop.done h3{text-decoration:line-through;}
  .food-note{margin-top:16px;font-size:13px;color:var(--ink-soft);line-height:1.7;padding:12px 14px;border:1px dashed var(--line);border-radius:8px;}

  /* overview */
  .block{margin-bottom:30px;}
  .block h3{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0 0 10px;}
  .block p{font-size:13.5px;line-height:1.75;color:var(--ink-soft);margin:0 0 8px;max-width:60ch;}
  .cards{display:grid;gap:10px;}
  .card{border:1px solid var(--line);border-radius:10px;padding:13px 15px;}
  .card .t{font-weight:600;font-size:14px;color:var(--ink);margin-bottom:2px;}
  .card .m{font-size:12.5px;color:var(--brass);font-weight:600;margin-bottom:6px;}
  .card .d{font-size:13px;color:var(--ink-soft);line-height:1.65;}
  .card .pending{color:var(--brick);font-weight:600;}
  ul.plain{margin:0;padding-left:18px;font-size:13.5px;line-height:1.75;color:var(--ink-soft);}
  ul.plain li{margin-bottom:4px;}
  .scroll{overflow-x:auto;}
  table.t{width:100%;border-collapse:collapse;font-size:12.5px;min-width:320px;}
  table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;color:var(--ink-soft);}
  table.t th{background:var(--parchment-dim);color:var(--ink);font-weight:600;}
  table.t tr.sum td{font-weight:600;color:var(--ink);}
  .todo{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6;color:var(--ink-soft);}
  .todo:last-child{border-bottom:1px solid var(--line);}
  .todo.done span.tx{opacity:.45;text-decoration:line-through;}
  .btn-link{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:500;color:var(--sage);text-decoration:none;border:1px solid var(--line);padding:5px 12px;border-radius:14px;margin:4px 8px 4px 0;}

  /* wishlist */
  .group{margin-bottom:28px;}
  .group h3{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0 0 4px;}
  .group .sub{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .wish{padding:14px 0;border-top:1px solid var(--line);}
  .wish:last-child{border-bottom:1px solid var(--line);}
  .wish h4{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;margin:0 0 3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .wish .when{font-size:11.5px;color:var(--brass);font-weight:600;margin-bottom:5px;}
  .wish p{margin:0 0 9px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);max-width:56ch;}

  .legend{display:flex;gap:8px 18px;flex-wrap:wrap;margin:34px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);}
  .legend .item{display:flex;align-items:center;gap:6px;}
  footer{max-width:780px;margin:0 auto;padding:26px 20px 40px;font-size:12px;color:var(--ink-soft);line-height:1.75;}

function sset(k,v){ try{ localStorage.setItem('cz202611-'+k, v); }catch(e){ mem[k]=v; } }

const pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
function mlink(label, query){
  return `<a class="map-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}">${pin}${label}</a>`;
}
function bucket(type){
  if(type==='景點') return 'sight';
  if(['餐廳','酒吧','咖啡店','點心'].includes(type)) return 'food';
  if(type==='交通') return 'transport';
  return 'stay';
}
function routeUrl(d){
  if(d.noRoute) return null;
  const qs = d.stops.filter(s=>s.type!=='交通' && s.type!=='住宿' && s.places && s.places.length).map(s=>s.places[0][1]);
  if(qs.length < 2) return null;
  const use = qs.slice(0,10);
  const origin = use[0], dest = use[use.length-1], way = use.slice(1,-1);
  let u = 'https://www.google.com/maps/dir/?api=1&travelmode=walking&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(dest);
  if(way.length) u += '&waypoints='+way.map(encodeURIComponent).join('%7C');
  return u;
}

/* ---------- state ---------- */
let keys = [];
function isOn(k){ return sget(k)==='1'; }

/* ---------- render ---------- */
function renderTabs(){
  let h = '<button class="tab" data-tab="info">行前資訊</button>';
  DAYS.forEach(d=>{ h += `<button class="tab" data-tab="d${d.day}">Day ${d.day}<small>${d.date}</small></button>`; });
  h += '<button class="tab" data-tab="wish">備選</button>';
  const el = document.getElementById('tabs'); el.innerHTML = h;
  el.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
}

function stopHtml(d, s, i){
  const k = `d${d.day}-${i}`; keys.push(k);
  const b = bucket(s.type);
  const links = (s.places||[]).map(p=>mlink(p[0],p[1])).join('');
  return `<div class="stop${isOn(k)?' done':''}" data-k="${k}">
    <div class="rail"><span class="time-chip">${s.time}</span><span class="cat"><i class="ico ico-${b}"></i>${s.type}</span></div>
    <div class="stop-body"><h3>${s.name}</h3>${s.note?`<p>${s.note}</p>`:''}${links?`<div class="links">${links}</div>`:''}</div>
    <button class="check${isOn(k)?' on':''}" data-k="${k}" aria-label="標記已到訪"></button>
  </div>`;
}

function renderDays(){
  const root = document.getElementById('panels');
  DAYS.forEach(d=>{
    const cityCls = d.city.startsWith('德勒斯登') ? 'city-dresden' : 'city-prague';
    const ru = routeUrl(d);
    const night = d.night ? `<div class="night"><span>今晚住宿</span><b class="${d.night.pending?'pending':''}">${d.night.text}</b>${d.night.query?mlink('地圖',d.night.query):''}</div>` : '';
    const alerts = (d.alerts||[]).map(a=>`<div class="alert"><b>提醒　</b>${a}</div>`).join('');
    const el = document.createElement('section');
    el.className = 'panel'; el.id = 'p-d'+d.day;
    el.innerHTML = `<div class="day-head">
        <div class="label">Day ${d.day}　${d.date}（${d.wd}）<span class="city-tag ${cityCls}">${d.city}</span></div>
        <h2>${d.title}</h2>
        <p class="pace">${d.summary}</p>
        ${night}${alerts}
        ${ru?`<a class="route-btn" target="_blank" rel="noopener" href="${ru}">${pin}開啟當日步行路線</a>`:'<div style="height:12px"></div>'}
      </div>
      ${d.stops.map((s,i)=>stopHtml(d,s,i)).join('')}
      ${d.foodNote?`<div class="food-note">${d.foodNote}</div>`:''}`;
    root.appendChild(el);
  });
}

function renderWish(){
  const el = document.createElement('section');
  el.className = 'panel'; el.id = 'p-wish';
  el.innerHTML = `<div class="day-head"><div class="label">尚未排入行程</div><h2>備選清單</h2>
    <p class="pace">這些是規劃紀錄中提到、但不在已確定行程內的地點，可以討論要不要加進哪一天，或當作天氣與時間彈性的備案。</p></div>` +
  WISH.map(g=>`<div class="group"><h3>${g.group}</h3>${g.sub?`<div class="sub">${g.sub}</div>`:''}${g.items.map(it=>{
      const b = bucket(it.type);
      return `<div class="wish"><h4><i class="ico ico-${b}"></i>${it.name}</h4>
        <div class="when">${[it.tag,it.when].filter(Boolean).join('　・　')}</div>
        <p>${it.note}</p><div class="links">${mlink('Google 地圖', it.q)}</div></div>`;
    }).join('')}</div>`).join('');
  document.getElementById('panels').appendChild(el);
}

/* ---------- interaction ---------- */
function updateProgress(){
  const total = keys.length;
  const done = keys.filter(isOn).length;
  document.getElementById('count').innerHTML = `已到訪　<b>${done} / ${total}</b>`;
  document.getElementById('bar').style.width = (total? done/total*100 : 0) + '%';
}
function show(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='p-'+id));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===id));
  window.scrollTo({top:0});
}
document.addEventListener('click', e=>{
  const b = e.target.closest('.check'); if(!b) return;
  const k = b.dataset.k; const on = !isOn(k); sset(k, on?'1':'0');
  b.classList.toggle('on', on);
  const row = b.closest('.stop, .todo'); if(row) row.classList.toggle('done', on);
  updateProgress();
});

renderTabs(); renderInfo(); renderDays(); renderWish(); updateProgress(); show('info');
</script>
